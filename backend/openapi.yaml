openapi: 3.0.3
info:
  title: Gaming Addiction Detection API
  description: |
    Backend REST API for the AI-driven gaming addiction detection system —
    PES University Capstone PW26_SAS-03.

    Three-modality server-side ML ensemble: behavioral Random Forest,
    TF-IDF/logistic-regression chat toxicity, and acoustic voice-emotion
    classification. Protected routes require the signed bearer token returned
    by login or registration.

    Score version 2 (November 2026): the fused risk score is the 40/30/30
    weighted mean of the channels present in the session, renormalised over
    those channels and clipped to [0, 1]. The game's genre no longer changes
    it, so prediction payloads carry `score_version` and no longer include the
    version-1 fields `genre_weight` and `game_genre`.
  version: '2.1.0'
  contact:
    name: PES Capstone Team

servers:
  - url: https://gaming-addiction-api.onrender.com
    description: Production
  - url: http://localhost:5000
    description: Local development
  - url: http://192.168.1.100:5000
    description: LAN deployment

tags:
  - name: Auth
  - name: Sessions
  - name: Data Ingestion
  - name: Dashboard (Child)
  - name: Dashboard (Parent)
  - name: Counselor
  - name: Reflection
  - name: Anomaly
  - name: Account
  - name: Monitoring

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      security: []
      tags: [Auth]
      summary: Health check
      responses:
        '200':
          description: OK

  /api/user/login:
    post:
      security: []
      tags: [Auth]
      summary: Login (child or parent role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, role]
              properties:
                pin: { type: string, example: '1234' }
                role: { type: string, enum: [child, parent] }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Bad PIN

  /api/games:
    get:
      security: []
      tags: [Sessions]
      summary: List supported games
      responses:
        '200': { description: Games list }

  /api/session/start:
    post:
      tags: [Sessions]
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, game_name]
              properties:
                user_id: { type: integer }
                game_name: { type: string }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  session_id: { type: integer }

  /api/session/{sid}/end:
    post:
      tags: [Sessions]
      summary: End session and run prediction
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: >-
            Session ended with prediction. A repeated end (already_ended) replays
            the stored prediction, whose score_version says which formula made it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  session_id: { type: integer }
                  duration_seconds: { type: integer }
                  short_session: { type: boolean }
                  already_ended: { type: boolean }
                  consent_required: { type: boolean }
                  prediction:
                    type: object
                    properties:
                      risk_label:
                        type: string
                        description: Internal band key (casual, at_risk, addicted or unknown)
                      risk_score: { type: number, format: float, nullable: true }
                      behavior_score: { type: number, format: float }
                      chat_score: { type: number, format: float }
                      voice_score: { type: number, format: float }
                      modalities: { $ref: '#/components/schemas/Modalities' }
                      recommendations: { type: array, items: { type: string } }
                      top_factors: { type: array, items: { type: object } }
                      observation_mode: { type: boolean }
                      sessions_analyzed: { type: integer }
                      score_version: { $ref: '#/components/schemas/ScoreVersion' }
        '503':
          description: Session saved but finalization is pending or in progress; retry

  /api/session/{sid}/behavioral:
    post:
      tags: [Data Ingestion]
      summary: Submit behavioral features mid-session
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      responses:
        '200': { description: OK }

  /api/session/{sid}/predict:
    post:
      tags: [Data Ingestion]
      summary: Run live ensemble prediction during session
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: >-
            Live prediction, or the stored one (session_closed) when the session
            has already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
        '409': { description: Session already closed and it has no stored prediction }

  /api/session/{sid}/voice:
    post:
      tags: [Data Ingestion]
      summary: Upload 10s voice WAV segment
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Maximum request size 2 MB.
          application/json:
            schema:
              type: object
              required: [emotion, intensity, duration_seconds]
              properties:
                emotion: { type: string, enum: [angry, frustrated, excited, neutral] }
                intensity: { type: number, minimum: 0, maximum: 1 }
                duration_seconds: { type: number, minimum: 0, maximum: 30 }
      responses:
        '200': { description: Emotion detected }
        '413': { description: Audio request exceeds 2 MB }

  /api/session/{sid}/chat:
    post:
      tags: [Data Ingestion]
      summary: Upload captured chat text
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                source: { type: string, enum: [keyboard, ime_keystroke, ocr, voice_stt] }
      responses:
        '200': { description: OK }

  /api/child/screen_event:
    post:
      tags: [Data Ingestion]
      summary: Log screen on/off/unlock (zero-permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                event_type: { type: string, enum: [screen_on, screen_off, unlocked] }
                timestamp: { type: string }
      responses:
        '200': { description: OK }

  /api/child/notification_event:
    post:
      tags: [Data Ingestion]
      summary: Log gaming app notification (craving signal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                package_name: { type: string }
                game_name: { type: string }
                notification_title: { type: string }
      responses:
        '200': { description: OK }

  /api/dashboard/user:
    get:
      tags: [Dashboard (Child)]
      summary: Child-side dashboard
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: Dashboard data with server-configured risk cutoffs
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_thresholds:
                    type: object
                    required: [some_concern, high_concern]
                    properties:
                      some_concern: { type: number, format: float }
                      high_concern: { type: number, format: float }

  /api/dashboard/child_enriched:
    get:
      tags: [Dashboard (Child)]
      summary: Streak + time limit status for child
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/child/streak:
    get:
      tags: [Dashboard (Child)]
      summary: Healthy gaming streak details
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/child/get_limit:
    get:
      tags: [Dashboard (Child)]
      summary: Get parent-set daily limit + today's usage
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/dashboard/parent:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent dashboard (full insights)
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200':
          description: Enriched dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_alert_count: { type: integer, minimum: 0 }
                  risk_thresholds:
                    type: object
                    required: [some_concern, high_concern]
                    properties:
                      some_concern: { type: number, format: float }
                      high_concern: { type: number, format: float }

  /api/dashboard/weekly_report/pdf:
    get:
      tags: [Dashboard (Parent)]
      summary: Generate weekly PDF report
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/parent/set_limit:
    post:
      tags: [Dashboard (Parent)]
      summary: Parent-set daily time limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
                daily_limit_hours: { type: number }
      responses:
        '200': { description: OK }

  /api/alerts:
    get:
      tags: [Dashboard (Parent)]
      summary: Recent alerts
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200':
          description: Newest alerts first (at most 200) plus the unread total
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  unread_count: { type: integer, minimum: 0 }
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }

  /api/counselor/chat:
    post:
      tags: [Counselor]
      summary: Chat with Mira, the AI wellness counselor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, message]
              properties:
                user_id: { type: integer }
                message: { type: string }
      responses:
        '200':
          description: Reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  reply: { type: string }
                  intent: { type: string }

  /api/counselor/history:
    get:
      tags: [Counselor]
      summary: Full chat history
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Messages array }

  /api/child/reflection:
    post:
      tags: [Reflection]
      summary: Submit daily mood/sleep/energy check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                mood_rating: { type: integer, minimum: 1, maximum: 5 }
                sleep_quality: { type: integer, minimum: 1, maximum: 5 }
                energy_level: { type: integer, minimum: 1, maximum: 5 }
                note: { type: string }
      responses:
        '200': { description: OK }

  /api/child/reflections:
    get:
      tags: [Reflection]
      summary: Recent reflections
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
        - { in: query, name: days, schema: { type: integer, default: 14 } }
      responses:
        '200': { description: OK }

  /api/anomalies:
    get:
      tags: [Anomaly]
      summary: Statistically unusual activity for a child
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Fresh + persisted anomalies }

  /api/anomalies/{aid}/resolve:
    post:
      tags: [Anomaly]
      summary: Mark an anomaly as acknowledged
      parameters:
        - { in: path, name: aid, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/model_card:
    get:
      security: []
      tags: [Auth]
      summary: Public model metrics and limitations
      responses:
        '200':
          description: Model card, including the served score_version and a fusion_note
          content:
            application/json:
              schema:
                type: object
                properties:
                  score_version: { $ref: '#/components/schemas/ScoreVersion' }
                  fusion_note: { type: string }

  /api/register:
    post:
      security: []
      tags: [Auth]
      summary: Register a child and create or join a family
      responses:
        '200': { description: Child registered and signed in }
        '400': { description: Invalid registration data }
        '403': { description: Family PIN mismatch }
        '409': { description: PIN already in use }

  /api/user/fcm_token:
    post:
      tags: [Monitoring]
      summary: Register a parent device FCM token
      responses:
        '200': { description: Token registered }

  /api/user/fcm_token/unregister:
    post:
      security: []
      tags: [Monitoring]
      summary: Remove a device FCM token during durable logout
      responses:
        '200': { description: Token removed }

  /api/user/profile:
    get:
      tags: [Account]
      summary: Get a child profile
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Child profile }

  /api/user/update:
    post:
      tags: [Account]
      summary: Parent-only child profile or family PIN update
      responses:
        '200': { description: Profile updated }

  /api/consent:
    get:
      tags: [Account]
      summary: Get the child consent-version status
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Consent status }
    post:
      tags: [Account]
      summary: Record parent-authorized consent for the current privacy version
      description: Requires a parent-role token, or the child's valid Family PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, version]
              properties:
                user_id: { type: integer, minimum: 1 }
                version: { type: string, example: '2026-07-30' }
                parent_pin: { type: string, pattern: '^[0-9]{4,6}$' }
      responses:
        '200': { description: Consent recorded }
        '400': { description: Invalid or outdated consent version }
        '403': { description: Parent authorization failed }

  /api/user/export:
    get:
      tags: [Account]
      summary: Parent-only export of a child's stored data
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: JSON data export }

  /api/user/delete_data:
    post:
      tags: [Account]
      summary: Parent-only deletion of child activity or account data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
                scope: { type: string, enum: [data, account], default: data }
      responses:
        '200': { description: Data deleted }

  /api/session/backfill:
    post:
      tags: [Sessions]
      summary: Idempotently store an offline completed session
      responses:
        '200':
          description: >-
            Backfill stored/scored or existing idempotent result returned; its
            prediction carries risk_label, risk_score and score_version

  /api/session/{sid}:
    get:
      tags: [Sessions]
      summary: Get a single owned session
      parameters:
        - { in: path, name: sid, schema: { type: integer }, required: true }
      responses:
        '200':
          description: >-
            Session detail. prediction is the latest stored predictions row; its
            score_version is null for a legacy row scored under version 1.
        '404': { description: Session not found }

  /api/sessions:
    get:
      tags: [Sessions]
      summary: List a child's sessions
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Session array }

  /api/analyse/chat:
    post:
      tags: [Data Ingestion]
      summary: Score one authenticated chat message without storing it
      responses:
        '200': { description: Toxicity score and band }

  /api/child/heartbeat:
    post:
      tags: [Monitoring]
      summary: Record child monitor, permission and voice-capture health
      responses:
        '200': { description: Heartbeat accepted }

  /api/child/tamper:
    post:
      tags: [Monitoring]
      summary: Report a child-side logout or protection event
      responses:
        '200': { description: Event recorded }

  /api/verify_parent_pin:
    post:
      tags: [Account]
      summary: Verify the family PIN before a protected child-side action
      responses:
        '200': { description: Verification result }

  /api/alerts/mark_read:
    post:
      tags: [Dashboard (Parent)]
      summary: Mark owned alerts as read
      responses:
        '200': { description: Alerts marked read }

  /api/feedback:
    post:
      tags: [Dashboard (Parent)]
      summary: Store or replace a parent's prediction verdict
      responses:
        '200': { description: Feedback stored }
        '400':
          description: >-
            Invalid input, or the alert type takes no verdict. Only risk,
            risk_revision, toxicity and toxicity_streak alerts do; score_update
            and monitoring-event alerts do not.
        '404': { description: Alert not found }

  /api/feedback/summary:
    get:
      tags: [Dashboard (Parent)]
      summary: Summarize parent verdict agreement
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Feedback summary }

  /api/child/status:
    get:
      tags: [Monitoring]
      summary: Get live playing status for a child
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Live child status }

  /api/dashboard/emotions:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent-only voice-emotion insights
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Emotion insights }

  /api/dashboard/chat_analysis:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent-only chat-toxicity insights
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Chat insights }

  /api/dashboard/weekly_report:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent-only seven-child-local-day report data
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Weekly report }

  /api/parent/children:
    get:
      tags: [Account]
      summary: List children currently authorized for this parent
      responses:
        '200': { description: Family child roster }

  /api/parent/nudge:
    post:
      tags: [Dashboard (Parent)]
      summary: Queue a one-off parent message for the child
      responses:
        '200': { description: Nudge queued }

  /api/child/nudges:
    get:
      tags: [Dashboard (Child)]
      summary: Get pending nudges without consuming them
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Pending nudges }

  /api/child/nudges/ack:
    post:
      tags: [Dashboard (Child)]
      summary: Acknowledge nudges after Android accepted their notification
      responses:
        '200': { description: Nudges acknowledged }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed-token
  schemas:
    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        user_id: { type: integer }
        name: { type: string }
        role: { type: string }
    ScoreVersion:
      type: integer
      enum: [1, 2]
      description: |
        Formula that produced the score. 2 (current): the weighted mean of the
        channels present in the session, renormalised over them and clipped to
        [0, 1], with no game-genre factor. 1: a legacy score stored before
        November 2026, when that mean was also multiplied by a per-genre weight.
        Stored as predictions.score_version; NULL there marks a version-1 row, and
        a replayed stored prediction reports it as 1.
    Modalities:
      type: object
      description: Which channels produced evidence for this session
      properties:
        behavior: { type: boolean }
        chat: { type: boolean }
        voice: { type: boolean }
    Prediction:
      type: object
      description: |
        Ensemble result for one session. The version-1 fields genre_weight and
        game_genre were removed with score version 2: no client read them, and
        the genre no longer affects the score.
      properties:
        success: { type: boolean }
        risk_category:
          type: string
          description: Internal band key (casual, at_risk, addicted or unknown)
        risk_label:
          type: string
          description: Same internal band key as risk_category, matching /end
        risk_score: { type: number, format: float, nullable: true }
        final_risk_score: { type: number, format: float, nullable: true }
        behavior_score: { type: number, format: float }
        chat_score: { type: number, format: float }
        voice_score: { type: number, format: float }
        confidence: { type: number, format: float }
        observation_mode: { type: boolean }
        sessions_analyzed: { type: integer }
        top_factors: { type: array, items: { type: object } }
        modalities: { $ref: '#/components/schemas/Modalities' }
        disclaimer: { type: string }
        score_version: { $ref: '#/components/schemas/ScoreVersion' }
        session_closed:
          type: boolean
          description: Present when the session had already ended and the stored prediction is returned
    Alert:
      type: object
      properties:
        id: { type: integer }
        type:
          type: string
          description: |
            risk, risk_revision, toxicity and toxicity_streak carry a model
            assessment and accept a parent verdict (POST /api/feedback).
            session_start, login, offline, permission and tamper report monitoring
            events. score_update is the one-time informational note (severity low,
            at most one per child, never pushed) raised when a child whose earlier
            sessions were scored under score version 1 receives a version-2 score;
            it takes no verdict and is not a risk alert.
        message: { type: string }
        severity:
          type: string
          description: info, low, medium or high
        created_at: { type: string }
        age_minutes: { type: integer, nullable: true }
        read: { type: boolean }
        feedback:
          type: string
          nullable: true
          description: The parent's verdict on this alert, if one was given
