openapi: 3.0.3
info:
  title: Gaming Addiction Detection API
  description: |
    Backend REST API for the AI-driven gaming addiction detection system —
    PES University Capstone PW26_SJ_05.

    Three-modality server-side ML ensemble: behavioral Random Forest,
    TF-IDF/logistic-regression chat toxicity, and acoustic voice-emotion
    classification. Protected routes require the signed bearer token returned
    by login or registration.
  version: '2.0.0'
  contact:
    name: PES Capstone Team

servers:
  - url: https://gaming-addiction-api.onrender.com
    description: Production
  - url: http://localhost:5000
    description: Local development
  - url: http://192.168.1.100:5000
    description: LAN deployment

tags:
  - name: Auth
  - name: Sessions
  - name: Data Ingestion
  - name: Dashboard (Child)
  - name: Dashboard (Parent)
  - name: Counselor
  - name: Reflection
  - name: Anomaly
  - name: Account
  - name: Monitoring

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      security: []
      tags: [Auth]
      summary: Health check
      responses:
        '200':
          description: OK

  /api/user/login:
    post:
      security: []
      tags: [Auth]
      summary: Login (child or parent role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, role]
              properties:
                pin: { type: string, example: '1234' }
                role: { type: string, enum: [child, parent] }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Bad PIN

  /api/games:
    get:
      security: []
      tags: [Sessions]
      summary: List supported games
      responses:
        '200': { description: Games list }

  /api/session/start:
    post:
      tags: [Sessions]
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, game_name]
              properties:
                user_id: { type: integer }
                game_name: { type: string }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  session_id: { type: integer }

  /api/session/{sid}/end:
    post:
      tags: [Sessions]
      summary: End session and run prediction
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: Session ended with prediction

  /api/session/{sid}/behavioral:
    post:
      tags: [Data Ingestion]
      summary: Submit behavioral features mid-session
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      responses:
        '200': { description: OK }

  /api/session/{sid}/predict:
    post:
      tags: [Data Ingestion]
      summary: Run live ensemble prediction during session
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      responses:
        '200': { description: Live prediction }

  /api/session/{sid}/voice:
    post:
      tags: [Data Ingestion]
      summary: Upload 10s voice WAV segment
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Maximum request size 2 MB.
          application/json:
            schema:
              type: object
              required: [emotion, intensity, duration_seconds]
              properties:
                emotion: { type: string, enum: [angry, frustrated, excited, neutral] }
                intensity: { type: number, minimum: 0, maximum: 1 }
                duration_seconds: { type: number, minimum: 0, maximum: 30 }
      responses:
        '200': { description: Emotion detected }
        '413': { description: Audio request exceeds 2 MB }

  /api/session/{sid}/chat:
    post:
      tags: [Data Ingestion]
      summary: Upload captured chat text
      parameters:
        - in: path
          name: sid
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                source: { type: string, enum: [keyboard, ime_keystroke, ocr, voice_stt] }
      responses:
        '200': { description: OK }

  /api/child/screen_event:
    post:
      tags: [Data Ingestion]
      summary: Log screen on/off/unlock (zero-permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                event_type: { type: string, enum: [screen_on, screen_off, unlocked] }
                timestamp: { type: string }
      responses:
        '200': { description: OK }

  /api/child/notification_event:
    post:
      tags: [Data Ingestion]
      summary: Log gaming app notification (craving signal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                package_name: { type: string }
                game_name: { type: string }
                notification_title: { type: string }
      responses:
        '200': { description: OK }

  /api/dashboard/user:
    get:
      tags: [Dashboard (Child)]
      summary: Child-side dashboard
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: Dashboard data with server-configured risk cutoffs
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_thresholds:
                    type: object
                    required: [some_concern, high_concern]
                    properties:
                      some_concern: { type: number, format: float }
                      high_concern: { type: number, format: float }

  /api/dashboard/child_enriched:
    get:
      tags: [Dashboard (Child)]
      summary: Streak + time limit status for child
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/child/streak:
    get:
      tags: [Dashboard (Child)]
      summary: Healthy gaming streak details
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/child/get_limit:
    get:
      tags: [Dashboard (Child)]
      summary: Get parent-set daily limit + today's usage
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/dashboard/parent:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent dashboard (full insights)
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200':
          description: Enriched dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_alert_count: { type: integer, minimum: 0 }
                  risk_thresholds:
                    type: object
                    required: [some_concern, high_concern]
                    properties:
                      some_concern: { type: number, format: float }
                      high_concern: { type: number, format: float }

  /api/dashboard/weekly_report/pdf:
    get:
      tags: [Dashboard (Parent)]
      summary: Generate weekly PDF report
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/parent/set_limit:
    post:
      tags: [Dashboard (Parent)]
      summary: Parent-set daily time limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
                daily_limit_hours: { type: number }
      responses:
        '200': { description: OK }

  /api/alerts:
    get:
      tags: [Dashboard (Parent)]
      summary: Recent alerts
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Alerts list }

  /api/counselor/chat:
    post:
      tags: [Counselor]
      summary: Chat with Mira, the AI wellness counselor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, message]
              properties:
                user_id: { type: integer }
                message: { type: string }
      responses:
        '200':
          description: Reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  reply: { type: string }
                  intent: { type: string }

  /api/counselor/history:
    get:
      tags: [Counselor]
      summary: Full chat history
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Messages array }

  /api/child/reflection:
    post:
      tags: [Reflection]
      summary: Submit daily mood/sleep/energy check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                mood_rating: { type: integer, minimum: 1, maximum: 5 }
                sleep_quality: { type: integer, minimum: 1, maximum: 5 }
                energy_level: { type: integer, minimum: 1, maximum: 5 }
                note: { type: string }
      responses:
        '200': { description: OK }

  /api/child/reflections:
    get:
      tags: [Reflection]
      summary: Recent reflections
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
        - { in: query, name: days, schema: { type: integer, default: 14 } }
      responses:
        '200': { description: OK }

  /api/anomalies:
    get:
      tags: [Anomaly]
      summary: Statistically unusual activity for a child
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Fresh + persisted anomalies }

  /api/anomalies/{aid}/resolve:
    post:
      tags: [Anomaly]
      summary: Mark an anomaly as acknowledged
      parameters:
        - { in: path, name: aid, schema: { type: integer }, required: true }
      responses:
        '200': { description: OK }

  /api/model_card:
    get:
      security: []
      tags: [Auth]
      summary: Public model metrics and limitations
      responses:
        '200': { description: Model card }

  /api/register:
    post:
      security: []
      tags: [Auth]
      summary: Register a child and create or join a family
      responses:
        '200': { description: Child registered and signed in }
        '400': { description: Invalid registration data }
        '403': { description: Family PIN mismatch }
        '409': { description: PIN already in use }

  /api/user/fcm_token:
    post:
      tags: [Monitoring]
      summary: Register a parent device FCM token
      responses:
        '200': { description: Token registered }

  /api/user/fcm_token/unregister:
    post:
      security: []
      tags: [Monitoring]
      summary: Remove a device FCM token during durable logout
      responses:
        '200': { description: Token removed }

  /api/user/profile:
    get:
      tags: [Account]
      summary: Get a child profile
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Child profile }

  /api/user/update:
    post:
      tags: [Account]
      summary: Parent-only child profile or family PIN update
      responses:
        '200': { description: Profile updated }

  /api/consent:
    get:
      tags: [Account]
      summary: Get the child consent-version status
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Consent status }
    post:
      tags: [Account]
      summary: Record parent-authorized consent for the current privacy version
      description: Requires a parent-role token, or the child's valid Family PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, version]
              properties:
                user_id: { type: integer, minimum: 1 }
                version: { type: string, example: '2026-07-30' }
                parent_pin: { type: string, pattern: '^[0-9]{4,6}$' }
      responses:
        '200': { description: Consent recorded }
        '400': { description: Invalid or outdated consent version }
        '403': { description: Parent authorization failed }

  /api/user/export:
    get:
      tags: [Account]
      summary: Parent-only export of a child's stored data
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: JSON data export }

  /api/user/delete_data:
    post:
      tags: [Account]
      summary: Parent-only deletion of child activity or account data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
                scope: { type: string, enum: [data, account], default: data }
      responses:
        '200': { description: Data deleted }

  /api/session/backfill:
    post:
      tags: [Sessions]
      summary: Idempotently store an offline completed session
      responses:
        '200': { description: Backfill stored/scored or existing idempotent result returned }

  /api/session/{sid}:
    get:
      tags: [Sessions]
      summary: Get a single owned session
      parameters:
        - { in: path, name: sid, schema: { type: integer }, required: true }
      responses:
        '200': { description: Session detail }
        '404': { description: Session not found }

  /api/sessions:
    get:
      tags: [Sessions]
      summary: List a child's sessions
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Session array }

  /api/analyse/chat:
    post:
      tags: [Data Ingestion]
      summary: Score one authenticated chat message without storing it
      responses:
        '200': { description: Toxicity score and band }

  /api/child/heartbeat:
    post:
      tags: [Monitoring]
      summary: Record child monitor, permission and voice-capture health
      responses:
        '200': { description: Heartbeat accepted }

  /api/child/tamper:
    post:
      tags: [Monitoring]
      summary: Report a child-side logout or protection event
      responses:
        '200': { description: Event recorded }

  /api/verify_parent_pin:
    post:
      tags: [Account]
      summary: Verify the family PIN before a protected child-side action
      responses:
        '200': { description: Verification result }

  /api/alerts/mark_read:
    post:
      tags: [Dashboard (Parent)]
      summary: Mark owned alerts as read
      responses:
        '200': { description: Alerts marked read }

  /api/feedback:
    post:
      tags: [Dashboard (Parent)]
      summary: Store or replace a parent's prediction verdict
      responses:
        '200': { description: Feedback stored }

  /api/feedback/summary:
    get:
      tags: [Dashboard (Parent)]
      summary: Summarize parent verdict agreement
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Feedback summary }

  /api/child/status:
    get:
      tags: [Monitoring]
      summary: Get live playing status for a child
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Live child status }

  /api/dashboard/emotions:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent-only voice-emotion insights
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Emotion insights }

  /api/dashboard/chat_analysis:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent-only chat-toxicity insights
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Chat insights }

  /api/dashboard/weekly_report:
    get:
      tags: [Dashboard (Parent)]
      summary: Parent-only seven-child-local-day report data
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Weekly report }

  /api/parent/children:
    get:
      tags: [Account]
      summary: List children currently authorized for this parent
      responses:
        '200': { description: Family child roster }

  /api/parent/nudge:
    post:
      tags: [Dashboard (Parent)]
      summary: Queue a one-off parent message for the child
      responses:
        '200': { description: Nudge queued }

  /api/child/nudges:
    get:
      tags: [Dashboard (Child)]
      summary: Get pending nudges without consuming them
      parameters:
        - { in: query, name: user_id, schema: { type: integer }, required: true }
      responses:
        '200': { description: Pending nudges }

  /api/child/nudges/ack:
    post:
      tags: [Dashboard (Child)]
      summary: Acknowledge nudges after Android accepted their notification
      responses:
        '200': { description: Nudges acknowledged }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed-token
  schemas:
    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        user_id: { type: integer }
        name: { type: string }
        role: { type: string }
