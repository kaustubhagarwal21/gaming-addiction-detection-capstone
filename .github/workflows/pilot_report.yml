# On-demand aggregate pilot snapshot from the PRODUCTION database.
# Manual dispatch only. The artifact is STRICTLY AGGREGATE (ml/pilot_report.py's
# privacy rule: counts/distributions/daily series — never chat text, notification
# titles, reflection notes, or names) because this repo is public; retention is
# kept short anyway.
name: Pilot report

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Pilot epoch (ISO date)'
        default: '2026-07-06'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # scikit-learn/joblib/pandas/flask etc. because the fusion-sensitivity step
        # imports the backend app (for the exact serving constants) and its models.
        run: pip install -r backend/requirements.txt psycopg2-binary
      - name: Aggregate pilot snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set"; exit 1
          fi
          python ml/pilot_report.py --since "${{ inputs.since || '2026-07-06' }}" \
            --json pilot_report.json
          # Companion aggregate diagnostics (best-effort, console reports only).
          python ml/analyze_reflections.py > reflections_check.txt 2>&1 || true
          python ml/analyze_voice_shadow.py --since "${{ inputs.since || '2026-07-06' }}" \
            > voice_shadow_check.txt 2>&1 || true
          # Corrected per-session fusion sensitivity + channel-contribution analysis
          # (replication-gated; refuses output if serving logic has diverged).
          python ml/analyze_fusion_sensitivity.py --since "${{ inputs.since || '2026-07-06' }}" \
            --output fusion_sensitivity.json > fusion_sensitivity_log.txt 2>&1 || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pilot-report
          path: |
            pilot_report.json
            reflections_check.txt
            voice_shadow_check.txt
            fusion_sensitivity.json
            fusion_sensitivity_log.txt
          retention-days: 2
