# CI: backend API tests + Android lint on every push/PR.
# Catches exactly the class of regression that has previously only surfaced on a
# real device or in production (the project's layered test program is otherwise
# run manually).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run API test suite (isolated SQLite DB)
        working-directory: backend
        run: python -m pytest tests/ -v

  # Same suite against the OTHER dialect. Production runs Postgres (DATABASE_URL on
  # Render) while local dev and the job above run SQLite — dual-dialect SQL that only
  # ever meets SQLite in CI is how "passes CI, 500s in prod" happens.
  backend-tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capstone
          POSTGRES_PASSWORD: capstone
          POSTGRES_DB: capstone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U capstone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run API test suite (Postgres dialect)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://capstone:capstone@localhost:5432/capstone_test
        run: python -m pytest tests/ -v

  # The two apps deliberately carry an IDENTICAL RiskPresentation (main + test) so
  # family-facing risk wording can never drift between them again — enforce it.
  shared-source-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RiskPresentation twins must match (apart from the package line)
        run: |
          set -e
          for f in "main/java/com/pes/gamingdetector/util/RiskPresentation.kt main/java/com/pes/parentmonitor/util/RiskPresentation.kt" \
                   "test/java/com/pes/gamingdetector/util/RiskPresentationTest.kt test/java/com/pes/parentmonitor/util/RiskPresentationTest.kt"; do
            set -- $f
            diff <(tail -n +2 "android/ChildApp/app/src/$1") <(tail -n +2 "android/ParentApp/app/src/$2") \
              || { echo "::error::RiskPresentation twins diverged: $1 vs $2"; exit 1; }
          done
          echo "twins identical"

  android-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ChildApp, ParentApp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint + JVM unit tests ${{ matrix.app }}
        working-directory: android/${{ matrix.app }}
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest --no-daemon
